<!DOCTYPE html>
<html>
	<head>
		<link rel="stylesheet" href="style.css">
		<script type="text/javascript" src="front.js"></script>
	</head>
	<body>
		<div class="login">
			<img src="logo.png" style="width:100%">
			<h1>Wireguard FMI</h1>
			<form>
				<select id="theDomainSelector">
					<option value="cs">Teachers &#38; Staff</option>
					<option value="scs">Students</option>
				</select>
				<input type="text" id="theUsername" placeholder="Username" required="required" />
				<input type="password" id="thePassword" placeholder="Password" required="required" />
				<input type="password" id="theKeyPassword" placeholder="Key Passphrase" required="required" />
				<button type="button" id="theGenerateButton" class="btn btn-primary btn-block btn-large">Generate</button>
			</form>
			<h2 id="responseField">Please wait, page loading.</h2>
		</div>

		<script>
			document.addEventListener("DOMContentLoaded", () => {
				bindJavaScript();
			});
		</script>
	</body>
</html>
